# NGINX Configuration for Yachid Flutter Web App - Com HTTPS
# Windows Server - Azure VM
# Backend NestJS está rodando em localhost:3000 (ajuste conforme necessário)

# Redirecionar HTTP para HTTPS
server {
    listen 80;
    server_name _;  # Substitua pelo seu domínio
    return 301 https://$host$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl http2;
    server_name _;  # Substitua pelo seu domínio ou IP da VM
    
    # Certificados SSL (ajuste os caminhos)
    ssl_certificate C:/nginx/conf/cert.pem;
    ssl_certificate_key C:/nginx/conf/key.pem;
    
    # Configurações SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Tamanho máximo de upload (ajuste conforme necessário)
    client_max_body_size 50M;

    # Logs
    access_log logs/yachid_access.log;
    error_log logs/yachid_error.log;

    # Root directory do Flutter Web build
    root C:/nginx/html/yachid;
    index index.html;

    # Configurações de compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Cache para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy reverso para o backend NestJS
    # Todas as requisições para /api serão redirecionadas para o NestJS
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Servir o Flutter Web App
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (opcional - para monitoramento)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
